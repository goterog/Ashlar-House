<!-- 
    Floating Search Widget - Búsqueda flotante para Hero Section
    Archivo de asset para conservar el código de la búsqueda flotante
    que fue removida de la página principal.
    
    Uso futuro: Copiar este código y pegarlo en la sección hero donde sea necesario.
-->

<div class="absolute bottom-0 left-0 right-0 flex justify-center">
    <div class="floating-search bg-white dark:bg-gray-800 rounded-xl shadow-xl p-4 max-w-md w-full mx-4">
        <div class="grid grid-cols-2 gap-3 mb-3">
            <div>
                <label for="check-in" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Llegada</label>
                <input type="date" id="check-in" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 dark:focus:ring-orange-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
            </div>
            <div>
                <label for="check-out" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Salida</label>
                <input type="date" id="check-out" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 dark:focus:ring-orange-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
            </div>
        </div>
        <div class="mb-3">
            <label for="guests" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Huéspedes</label>
            <select id="guests" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 dark:focus:ring-orange-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                <option>2 Huéspedes</option>
                <option>4 Huéspedes</option>
                <option>6 Huéspedes</option>
                <option>8 Huéspedes</option>
            </select>
        </div>
        <button class="w-full bg-green-600 hover:bg-green-700 dark:bg-orange-500 dark:hover:bg-orange-600 text-white py-2 rounded-md font-medium transition">Buscar</button>
    </div>
</div>
