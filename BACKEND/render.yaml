# render.yaml - Configuración para despliegue en Render.com
# Actualizado: 23 de Junio, 2025 - Ashlar House Tourism Management System

databases:
  - name: ashlar-house-db
    databaseName: ashlar_house
    user: ashlar_house
    region: ohio

services:
  # Backend - Strapi v5 + TypeScript CMS
  - type: web
    name: ashlar-house-backend
    runtime: node
    env: node
    repo: https://github.com/goterog/ashlar-house.git
    branch: main  # Solo deploys desde main branch
    autoDeploy: true  # Deploy automático cuando haces push a main
    region: ohio    
    buildCommand: npm run build
    startCommand: npm run start
    plan: free
    healthCheckPath: /_health
    envVars:
      # Strapi Core Configuration
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      
      # Database Configuration (PostgreSQL) - Usando DATABASE_URL
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: ashlar-house-db
          property: connectionString
      - key: DATABASE_SSL
        value: true
      
      # Strapi Security Keys (Auto-generated)
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: JWT_SECRET
        generateValue: true      
      - key: ENCRYPTION_KEY
        generateValue: true
      
      # WhatsApp Notifications (CallMeBot API)
      - key: CALLMEBOT_API_KEY_1
        value: "4639929"    # Para +5218119936655
      - key: CALLMEBOT_API_KEY_2
        value: "1855584"    # Para +5218111755533
      
      # EmailJS Configuration (Newsletter System)
      - key: EMAILJS_PUBLIC_KEY
        value: "fjE9Qo5zVa2mfHE4m"
      - key: EMAILJS_SERVICE_ID
        value: "service_dk8fe1s"
      - key: EMAILJS_TEMPLATE_ID
        value: "template_8xeecee"
      
      # Admin Configuration
      - key: ADMIN_EMAIL
        value: "admin@ashlarhouse.com"
      
      # CORS Configuration for Frontend
      - key: FRONTEND_URL
        value: "https://ashlar-house-frontend.onrender.com"

  # Frontend - Landing Page Estática
  - type: static
    name: ashlar-house-frontend
    runtime: static
    repo: https://github.com/goterog/ashlar-house.git
    branch: main  # Deploy desde main
    autoDeploy: true  # Deploy automático del frontend
    region: ohio
    buildCommand: cd ../FRONTEND && npm install && npm run build
    staticPublishPath: ../FRONTEND/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=86400
      - path: /js/*
        name: Cache-Control
        value: public, max-age=604800  # 7 días para JS
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=2592000  # 30 días para assets
    envVars:
      - key: STRAPI_API_URL
        value: https://ashlar-house-backend.onrender.com
