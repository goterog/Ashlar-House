# render.yaml - Configuración para despliegue en Render.com

databases:
  - name: cabana-hanuman-db
    databaseName: cabana_hanuman
    user: cabana_hanuman
    region: ohio

services:
  # Backend - Strapi CMS
  - type: web
    name: cabana-hanuman-backend
    runtime: node
    env: node
    repo: https://github.com/tu-usuario/cabana-hanuman.git # Reemplazar con tu repo
    region: ohio
    buildCommand: cd BACKEND && npm ci && npm run build
    startCommand: cd BACKEND && npm start
    plan: starter
    healthCheckPath: /_health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_HOST
        fromDatabase:
          name: cabana-hanuman-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: cabana-hanuman-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: cabana-hanuman-db
          property: database
      - key: DATABASE_USERNAME
        fromDatabase:
          name: cabana-hanuman-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: cabana-hanuman-db
          property: password
      - key: DATABASE_SSL
        value: true
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: CALLMEBOT_API_KEY
        sync: false # Configurar manualmente en el dashboard

  # Frontend - Sitio estático
  - type: static
    name: cabana-hanuman-frontend
    runtime: static
    repo: https://github.com/tu-usuario/cabana-hanuman.git # Reemplazar con tu repo
    region: ohio
    buildCommand: echo "No build needed for static HTML"
    staticPublishPath: ./FRONTEND
    routes:
      - type: rewrite
        source: /*
        destination: /cabaña hanuman08.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=86400
    envVars:
      - key: STRAPI_API_URL
        value: https://cabana-hanuman-backend.onrender.com
